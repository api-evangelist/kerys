name: Kerys
description: >-
  Kerys Software is a European (Palaiseau, France) cybersecurity company behind
  YS::Desktop, a Type 1 hypervisor that runs multiple fully isolated environments
  on a single workstation. By preallocating dedicated CPU cores to the hypervisor
  versus VM workloads and adding hypervisor-level encryption, YS::Desktop closes VM
  escape and cross-VM attack vectors while sustaining roughly 92% native performance.
  It replaces dedicated admin machines, air-gapped OT laptops, and traditional VDI
  for regulated organizations in aerospace and defense, energy, finance, construction,
  and the public sector, with a mandatory Security Domain model (no unmanaged VMs)
  administered through the YAC console. The company positions around NIS2, IEC 62443,
  and ANSSI multi-environment workstation guidance and sells 100% through resellers.
  Kerys does not publish a public developer API, developer portal, SDKs, or pricing;
  it was surfaced as a Seedcamp portfolio company and enriched here from its public site.
